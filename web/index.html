<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataGuard AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <nav><strong>DataGuard AI</strong><span>Telecom revenue-impact monitoring</span></nav>
    <section>
      <p class="eyebrow">AI-powered pipeline failure detection</p>
      <h1>Detect data failures before they become revenue leakage.</h1>
      <p>Monitor missing files, ETL lag, replication risk, and abnormal revenue variance from one focused command center.</p>
    </section>
  </header>

  <main>
    <section class="cards" id="kpis"></section>
    <section class="grid">
      <article>
        <h2>Open Alerts</h2>
        <div id="alerts" class="stack"></div>
      </article>
      <article>
        <h2>Critical Feeds</h2>
        <div id="feeds" class="stack"></div>
      </article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
